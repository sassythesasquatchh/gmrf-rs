[package]
name = "gmrf-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Patrick Dowd", "Tim Weiland"]
description = "Sparse precision algebra and solvers for Gaussian Markov random fields"
license = "MIT"
repository = "https://github.com/sassythesasquatchh/gmrf-rs"
readme = "README.md"
publish = false

[dependencies]
faer = "0.24"
rand = "0.8"
rand_distr = "0.4"
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "solver"
harness = false
